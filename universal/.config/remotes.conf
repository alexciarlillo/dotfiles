# Per-host identity + colors, consumed by ~/.local/bin/remote-badge.
# Starship and tmux both render a colored "chip" from this single mapping;
# nothing changes the terminal background, so your colorscheme is untouched.
#
# Columns, pipe-delimited (surrounding whitespace is trimmed):
#   id      SSH-config alias / logical name. An exported REMOTE_ID overrides
#           hostname matching and selects a row by this value.
#   match   glob compared against `hostname -f` (then `hostname`) to auto-detect
#           the current machine. Leave empty for rows selected only via REMOTE_ID.
#   display text shown in the prompt / status bar (the friendly override).
#   fg      chip foreground, #RRGGBB.
#   bg      chip background, #RRGGBB. Empty => render as bold fg-colored text
#           instead of a filled chip.
#
# First matching row wins, so keep any broad globs last. Unmapped hosts show
# no chip locally, and a plain short hostname over SSH.
#
# NB: `match` is compared against the box's OWN `hostname -f`, not the ssh alias.
# Verify each glob by running `hostname -f` on that machine; the values below are
# best guesses. A glob must NOT match your local machine (whose hostname is
# HQ-*). The reliable alternative is to `export REMOTE_ID=<id>` from an unstowed
# ~/.config/zsh/env.d/ drop-in on the box itself, which wins over any glob.

# id           | match             | display      | fg      | bg
macbook  | HQ-* | local | #1e2030 | #f5e0dc
coder-engine   | aciarlillo-aciarlillo-engine* | coder-engine | #1e2030 | #8bd5ca
dev.local      | dev*               | dev          | #1e2030 | ##c6a0f6
fiddlers-green | fiddlers-green*    | vps          | #1e2030 | #a6da95
